<body>

  <div class="toast-container" id="toast-container"></div>
  <div class="header">
    <div class="header-title" onclick="selectView('')" style="cursor:pointer;">QA 컨트롤 센터</div>
    <div class="header-meta" id="header-meta"></div>
    <div style="flex:1"></div>
    <button type="button" class="header-quick-run" onclick="selectView('quick_run')">빠른 실행</button>
  </div>

  <div class="body-wrap">
    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <!-- 대시보드 섹션 -->
        <!-- 개요 섹션 -->
        <div class="sidebar-section">
          <div class="sidebar-label">개요</div>
          <div class="sidebar-item active" id="tab-" onclick="selectView('')">
            <div class="sidebar-dot-spacer"></div>
            <span class="sidebar-name">대시보드</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">TC 작성</div>
          <div class="sidebar-item" id="tab-tc_studio" onclick="selectView('tc_studio')">
            <div class="sidebar-dot-spacer"></div>
            <span class="sidebar-name">TC 스튜디오</span>
          </div>
        </div>

        <!-- 파이프라인 섹션 -->
        <div class="sidebar-section">
          <div class="sidebar-label">실행</div>
          <div class="sidebar-item" id="tab-quick_run" onclick="selectView('quick_run')">
            <div class="sidebar-dot" id="dot-quick"></div>
            <span class="sidebar-name">빠른 실행</span>
          </div>
          <div class="sidebar-item" id="tab-single_pipeline" onclick="selectView('single_pipeline')">
            <div class="sidebar-dot" id="dot-single"></div>
            <span class="sidebar-name">단일 파이프라인</span>
          </div>
          <div class="sidebar-item" id="tab-parallel_pipeline" onclick="selectView('parallel_pipeline')">
            <div class="sidebar-dot" id="dot-parallel"></div>
            <span class="sidebar-name">병렬 파이프라인</span>
          </div>
        </div>

        <!-- 테스트 리포트 섹션 -->
        <div class="sidebar-section">
          <div class="sidebar-label">결과</div>
          <div class="sidebar-item" id="tab-reports" onclick="selectView('reports')">
            <div class="sidebar-dot-spacer"></div>
            <span class="sidebar-name">리포트</span>
          </div>
          <div class="sidebar-item" id="tab-history" onclick="selectView('history')">
            <div class="sidebar-dot-spacer"></div>
            <span class="sidebar-name">실행 기록</span>
          </div>
        </div>

        <!-- 팀 토론 섹션 -->
        <div class="sidebar-section" id="team-section">
          <div class="sidebar-label" style="display:flex;align-items:center;justify-content:space-between;">
            팀 토론
            <button class="sidebar-reset" onclick="resetTeamDiscussion()" title="팀 토론 초기화">리셋</button>
          </div>
          <div class="sidebar-item" id="tab-team_new" onclick="selectView('team_new')">
            <div class="sidebar-dot-spacer"></div>
            <span class="sidebar-name">새 토론 시작</span>
          </div>
          <div id="team-tabs"></div>
        </div>

        <!-- 설정 섹션 -->
        <div class="sidebar-section">
          <div class="sidebar-item" id="tab-pages" onclick="selectView('pages')">
            <div class="sidebar-dot-spacer"></div>
            <span class="sidebar-name">페이지 URL 관리</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 오른쪽 콘텐츠 -->
    <div class="content-wrap">
      <div class="content-scroll" id="main">
        <div class="empty">
          <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="6" width="24" height="28" rx="3"></rect><line x1="13" y1="14" x2="27" y2="14"></line><line x1="13" y1="20" x2="27" y2="20"></line><line x1="13" y1="26" x2="21" y2="26"></line></svg></div>
          <h2>QA 컨트롤 센터</h2>
          <p>왼쪽 패널에서 항목을 선택하세요</p>
        </div>
      </div>
    </div>
  </div>

  <!-- JS: constants → state → utils → api → components → views → router → app -->
  <script src="/static/js/constants.js"></script>

  <script src="/static/js/views/pages.js"></script>
  <script src="/static/js/views/reports.js"></script>
  <script src="/static/js/views/team.js"></script>
  <script src="/static/js/tc-studio/api.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/tc-studio/state.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/tc-studio/detail.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/tc-studio/library.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/tc-studio/import.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/tc-studio/generate.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/tc-studio/connectors.js?v=20260930-integration-auto-removed"></script>

  <script src="/static/js/tc-studio/review.js?v=20260930-integration-auto-removed"></script>


  <script src="/static/js/tc-studio/export.js?v=20260930-integration-auto-removed"></script>


  <script src="/static/js/tc-studio/main.js?v=20260930-integration-auto-removed"></script>
  <script src="/static/js/router.js"></script>
  <script src="/static/js/app.js"></script>
</body>

</html>
