<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리포트 목록 — 디자인 시안</title>
  <style>
    :root { color-scheme: dark; --bg:#08071b; --surface:rgba(18,16,42,.78); --surface2:rgba(28,24,60,.72); --border:rgba(140,120,220,.18); --text:#f0eff5; --muted:#b8b3d0; --accent:#8b5cf6; --blue:#60a5fa; --danger:#fb7185; --radius:14px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 15% 0%,rgba(88,40,180,.2),transparent 45%),radial-gradient(ellipse at 85% 100%,rgba(60,30,140,.14),transparent 45%),var(--bg); color:var(--text); font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { max-width:1180px; margin:0 auto; padding:42px 34px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:7px 0 5px; font-size:28px; letter-spacing:-.03em; }
    .subtitle { margin:0 0 26px; color:var(--muted); }
    .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px; margin-bottom:14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); backdrop-filter:blur(16px); }
    input, select, button { font:inherit; }
    input, select { border:1px solid var(--border); border-radius:9px; background:rgba(8,7,27,.7); color:var(--text); padding:9px 12px; }
    .search { flex:1; min-width:220px; }
    button { cursor:pointer; border:1px solid var(--border); border-radius:9px; padding:9px 13px; color:var(--text); background:var(--surface2); }
    button:hover, button:focus-visible { border-color:var(--accent); outline:none; }
    .danger { color:var(--danger); }
    .count { margin-left:auto; color:var(--muted); font-size:12px; }
    .workspace { display:grid; grid-template-columns:minmax(350px,.9fr) minmax(440px,1.35fr); gap:14px; align-items:stretch; }
    .panel { min-height:570px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); backdrop-filter:blur(16px); overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:17px 18px; border-bottom:1px solid var(--border); background:rgba(28,24,60,.42); }
    .panel-head strong { font-size:13px; }
    .report-row { display:grid; grid-template-columns:34px 1fr auto; gap:11px; width:100%; padding:15px 17px; border:0; border-bottom:1px solid rgba(140,120,220,.1); border-radius:0; background:transparent; text-align:left; }
    .report-row:hover, .report-row.selected { background:rgba(139,92,246,.11); }
    .report-icon { display:grid; place-items:center; width:30px; height:30px; border-radius:8px; background:rgba(96,165,250,.12); color:var(--blue); font-size:16px; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650; }
    .meta { margin-top:3px; color:var(--muted); font-size:11px; }
    .actions { display:flex; gap:6px; align-items:center; }
    .actions button { padding:6px 8px; font-size:11px; background:transparent; }
    .preview { display:flex; flex-direction:column; }
    .preview-body { flex:1; margin:16px; border:1px solid var(--border); border-radius:10px; background:#fff; color:#202033; overflow:hidden; }
    .fake-report-head { padding:15px 18px; background:#f3f1fb; border-bottom:1px solid #ddd9ed; font-weight:700; }
    .fake-report-content { padding:22px; }
    .fake-chart { height:180px; margin-top:16px; border-radius:8px; background:linear-gradient(135deg,#ede9fe,#dbeafe); position:relative; overflow:hidden; }
    .fake-chart:after { content:""; position:absolute; inset:45px 24px 28px; border-bottom:3px solid #7c3aed; border-radius:50%; transform:skewY(-8deg); }
    .hint { padding:20px; text-align:center; color:var(--muted); }
    .toast { position:fixed; right:24px; bottom:24px; padding:12px 15px; border:1px solid var(--border); border-radius:10px; background:#17132f; color:var(--text); box-shadow:0 12px 30px #0007; display:none; }
    @media (max-width:820px) { .shell{padding:26px 16px}.workspace{grid-template-columns:1fr}.panel{min-height:0}.preview{min-height:430px}.count{margin-left:0;width:100%} }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">QA-Native · Design proposal</div>
    <h1>테스트 리포트</h1>
    <p class="subtitle">생성된 실행 결과를 확인하고 필요한 리포트만 관리하세요.</p>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="리포트 이름 검색" aria-label="리포트 이름 검색">
      <select aria-label="정렬"><option>최신순</option><option>오래된순</option><option>파일명순</option></select>
      <button type="button" onclick="alert('새로고침 동작 시안')">↻ 새로고침</button>
      <button type="button" class="danger" onclick="alert('선택 삭제 동작 시안')">선택 삭제</button>
      <span class="count" id="count">3개 리포트</span>
    </div>
    <section class="workspace" aria-label="리포트 작업 공간">
      <div class="panel" aria-label="리포트 목록">
        <div class="panel-head"><strong>리포트 목록</strong><span class="meta">행을 선택하면 미리보기</span></div>
        <div id="list"></div>
      </div>
      <div class="panel preview" aria-label="리포트 미리보기">
        <div class="panel-head"><strong id="preview-title">미리보기</strong><button type="button" onclick="alert('새 탭 열기 동작 시안')">새 탭 ↗</button></div>
        <div class="preview-body" id="preview"><div class="hint">왼쪽에서 리포트를 선택하세요.</div></div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const reports = [
      {name:'login_20260905_1942.html', date:'2026.09.05 19:42', size:'128 KB'},
      {name:'checkout_20260905_1810.html', date:'2026.09.05 18:10', size:'94 KB'},
      {name:'import_studio_20260904_2320.html', date:'2026.09.04 23:20', size:'211 KB'}
    ];
    let selected = 0;
    const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render() {
      const q = document.querySelector('#search').value.toLowerCase();
      const visible = reports.filter(r => r.name.toLowerCase().includes(q));
      document.querySelector('#count').textContent = `${visible.length}개 리포트`;
      document.querySelector('#list').innerHTML = visible.length ? visible.map(r => {
        const i = reports.indexOf(r);
        return `<div class="report-row ${i===selected?'selected':''}" role="button" tabindex="0" onclick="choose(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(${i})}">
          <span class="report-icon" aria-hidden="true">▤</span><div><div class="name">${esc(r.name)}</div><div class="meta">${r.date} · ${r.size}</div></div>
          <span class="actions"><button type="button" onclick="event.stopPropagation();alert('새 탭 열기 동작 시안')">열기</button><button type="button" class="danger" onclick="event.stopPropagation();removeReport(${i})">삭제</button></span>
        </div>`;
      }).join('') : '<div class="hint">검색 결과가 없습니다.</div>';
    }
    function choose(i){ selected=i; const r=reports[i]; document.querySelector('#preview-title').textContent=r.name; document.querySelector('#preview').innerHTML='<div class="fake-report-head">QA 실행 리포트</div><div class="fake-report-content"><strong>실행 결과 요약</strong><p>'+r.date+' · '+r.size+'</p><div class="fake-chart"></div></div>'; render(); }
    function removeReport(i){ if(confirm(`“${reports[i].name}” 리포트를 삭제할까요?`)){ const [r]=reports.splice(i,1); if(selected>=reports.length) selected=Math.max(0,reports.length-1); showToast(`${r.name} 삭제 시안`); render(); } }
    function showToast(t){ const e=document.querySelector('#toast'); e.textContent=t; e.style.display='block'; setTimeout(()=>e.style.display='none',1800); }
    document.querySelector('#search').addEventListener('input',render); render();
  </script>
</body>
</html>
