[pytest]
# 저장소 자체 단위 테스트만 기본 수집 대상.
# python_files = *.py 였을 때 scripts/*.py, agents/dashboard/serve.py 같은
# 비테스트 모듈까지 import되어 (import 시점 sys.exit 호출로) 수집이 INTERNALERROR로 죽었다.
testpaths = tests
python_files = tc_*.py test_*.py
python_classes = Test*
python_functions = test_*

# tests/generated/ 는 파이프라인이 생성하는 Playwright 테스트라 실행에 실제 브라우저와
# 대상 사이트가 필요하다. 기본 수집에서는 빼되, 파이프라인은 경로를 명시적으로 넘기므로
# (05_execute / 06_heal / 06_auto_heal / 99_merge) 그대로 실행된다.
norecursedirs = .* __pycache__ node_modules venv .venv build dist *.egg tests/generated tests/reports tests/traces
