<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TC 스튜디오 — 모달 (스위트·연결)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
</style>
</head>
<body>
<div style="min-height: 1000px; background: #F5F6F8; color: #111827; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div><h1 style="margin: 0; font-size: 22px; font-weight: 600">TC 스튜디오 — 모달 (스위트·연결)</h1><p style="margin: 6px 0 0; font-size: 13px; color: #4B5563">스위트 삭제·연결 설정·스위트 메뉴</p></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start"><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">스위트 삭제</div><div role="dialog" aria-label="‘TC스튜디오_엑셀왕복’ 스위트를 삭제할까요?" style="width: 560px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgb(17 24 39 / .18); overflow: hidden"><div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2E5EA"><h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1; color: #B91C1C">‘TC스튜디오_엑셀왕복’ 스위트를 삭제할까요?</h2><button type="button" aria-label="닫기" style="border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280; cursor: pointer">닫기</button></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6"><div style="display: flex; gap: 16px; padding: 10px 12px; background: #F0F2F5; border-radius: 6px">TC <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #111827">5</span>건 · 시트 <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #111827">2</span>개</div><ul style="margin: 0; padding-left: 18px; font-size: 13px; color: #4B5563"><li>삭제한 스위트는 30일 동안 보관되며 ⋯ › 삭제한 스위트에서 복원할 수 있습니다.</li><li>내보낸 TC 파일과 원본 엑셀은 그대로 남습니다.</li></ul></div><div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #E2E5EA; background: #F5F6F8"><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">엑셀로 백업 먼저 받기</button><span style="flex-grow: 1"></span><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">취소</button><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 16px; background: #B91C1C; color: #FEFEFE; border: 0; font-weight: 600">스위트 삭제</button></div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">스위트 메뉴 (기본양식 선택 시)</div><div role="menu" style="width: 260px; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 8px; box-shadow: 0 12px 32px rgb(17 24 39 / .12); padding: 6px"><button type="button" role="menuitem" disabled title="기본 양식은 삭제할 수 없습니다" style="display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280">현재 스위트 삭제…</button><button type="button" role="menuitem" style="display: flex; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; font: inherit; font-size: 14px">삭제한 스위트<span style="flex-grow: 1"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6B7280">1</span></button></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">연결 설정</div><div role="dialog" aria-label="Confluence · Figma 연결" style="width: 560px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgb(17 24 39 / .18); overflow: hidden"><div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2E5EA"><h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1">Confluence · Figma 연결</h2><button type="button" aria-label="닫기" style="border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280; cursor: pointer">닫기</button></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">Confluence 주소<input type="text" value="https://wiki.example.com" placeholder="" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">이메일<input type="text" value="qa@example.com" placeholder="" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">API 토큰<input type="password" value="••••••••" aria-label="Confluence API 토큰" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; font: inherit"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">Figma 개인 토큰<input type="password" placeholder="figd_…" aria-label="Figma 토큰" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; font: inherit"></label><p style="margin: 0; font-size: 12px; color: #6B7280">토큰은 이 PC에만 저장되고 화면에 다시 표시하지 않습니다.</p></div><div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #E2E5EA; background: #F5F6F8"><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">연결 시험</button><span style="flex-grow: 1"></span><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">취소</button><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 16px; background: #1F4FD1; color: #FEFEFE; border: 0; font-weight: 600">저장</button></div></div></div></div>
</div>
</body>
</html>
