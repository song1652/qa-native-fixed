<!doctype html>
<html lang="ko">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>

<body>
<div style="min-height: 1000px; background: #F5F6F8; color: #111827; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div><h1 style="margin: 0; font-size: 22px; font-weight: 600">TC 스튜디오 — 모달 (편집)</h1><p style="margin: 6px 0 0; font-size: 13px; color: #4B5563">시트·분류·이동·삭제·저장 안 함</p></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start"><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">시트 추가 / 이름 변경</div><div role="dialog" aria-label="시트 이름 변경" style="width: 560px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgb(17 24 39 / .18); overflow: hidden"><div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2E5EA"><h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1">시트 이름 변경</h2><button type="button" aria-label="닫기" style="border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280; cursor: pointer">닫기</button></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">새 이름<input type="text" value="회원가입" placeholder="" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label><span style="font-size: 12px; color: #B91C1C">같은 이름의 시트가 이미 있습니다</span></div><div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #E2E5EA; background: #F5F6F8"><span style="flex-grow: 1"></span><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">취소</button><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 16px; background: #1F4FD1; color: #FEFEFE; border: 0; font-weight: 600">저장</button></div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">계층 이동</div><div role="dialog" aria-label="3건을 옮길 위치" style="width: 560px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgb(17 24 39 / .18); overflow: hidden"><div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2E5EA"><h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1">3건을 옮길 위치</h2><button type="button" aria-label="닫기" style="border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280; cursor: pointer">닫기</button></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">대분류<select style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"><option>혜택 탭</option></select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">중분류<select style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"><option>상단 배너</option></select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">소분류<select style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"><option>(없음)</option></select></label></div><p style="margin: 0; font-size: 12px; color: #6B7280">다른 시트로는 옮길 수 없습니다.</p></div><div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #E2E5EA; background: #F5F6F8"><span style="flex-grow: 1"></span><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">취소</button><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 16px; background: #1F4FD1; color: #FEFEFE; border: 0; font-weight: 600">이동</button></div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">케이스 삭제</div><div role="dialog" aria-label="케이스 3건을 삭제할까요?" style="width: 560px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgb(17 24 39 / .18); overflow: hidden"><div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2E5EA"><h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1; color: #B91C1C">케이스 3건을 삭제할까요?</h2><button type="button" aria-label="닫기" style="border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280; cursor: pointer">닫기</button></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6"><p style="margin: 0">삭제한 케이스는 변경 이력에서 복원할 수 있습니다. 엑셀 다음 내보내기부터 빠집니다.</p></div><div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #E2E5EA; background: #F5F6F8"><span style="flex-grow: 1"></span><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">취소</button><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 16px; background: #B91C1C; color: #FEFEFE; border: 0; font-weight: 600">삭제</button></div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; color: #6B7280">저장 안 함</div><div role="dialog" aria-label="저장하지 않은 변경이 있습니다" style="width: 560px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgb(17 24 39 / .18); overflow: hidden"><div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2E5EA"><h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1">저장하지 않은 변경이 있습니다</h2><button type="button" aria-label="닫기" style="border: 0; background: none; font: inherit; font-size: 14px; color: #6B7280; cursor: pointer">닫기</button></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6"><p style="margin: 0">S01_0001의 Expected 수정이 저장되지 않았습니다.</p></div><div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #E2E5EA; background: #F5F6F8"><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #B91C1C; border: 1px solid #E2E5EA">버리기</button><span style="flex-grow: 1"></span><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA">계속 편집</button><button type="button"  style="height: 34px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 16px; background: #1F4FD1; color: #FEFEFE; border: 0; font-weight: 600">저장</button></div></div></div></div>
</div>
</body>
</html>
