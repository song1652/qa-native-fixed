<!doctype html><html lang="ko"><meta charset="utf-8"><title>TC 스튜디오 QA 실습</title><style>body{font:17px system-ui;max-width:540px;margin:70px auto;padding:24px;background:#f6f8fb}form{background:white;padding:28px;border-radius:16px}label{display:block;margin:18px 0}input:not([type=checkbox]){display:block;padding:10px;width:90%}button{padding:10px 20px;margin-right:10px}#error{color:#b42318}#result{color:#067647}</style><h1>회원 등록</h1><form novalidate><label>이름<input name="name" autocomplete="off"></label><label>이메일<input name="email" autocomplete="off"></label><label><input type="checkbox" name="terms"> 약관 동의</label><button type="submit">등록</button><button type="reset">초기화</button><p id="error" role="alert"></p><p id="result" role="status"></p></form><script>const f=document.querySelector('form'),e=document.querySelector('#error'),r=document.querySelector('#result');f.addEventListener('submit',v=>{v.preventDefault();e.textContent='';r.textContent='';const n=f.elements.name.value.trim(),m=f.elements.email.value.trim();if(!n)e.textContent='이름을 입력하세요.';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m))e.textContent='이메일 형식을 확인하세요.';else if(!f.elements.terms.checked)e.textContent='약관에 동의하세요.';else r.textContent=`등록 완료: ${n} (${m})`;});f.addEventListener('reset',()=>{e.textContent='';r.textContent='';});</script></html>
